name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        run: pnpm build
        
      - name: Sync Capacitor Android
        run: |
          pnpm add -D -w @capacitor/cli @capacitor/android
          # If the android folder exists but gradlew is missing, 
          # run 'cap sync' to restore build files without overwriting your Java code.
          if [ -d "android" ] && [ ! -f "android/gradlew" ]; then
            pnpm exec cap sync android
          elif [ ! -d "android" ]; then
            pnpm exec cap add android
          fi

      - name: Build Android APK
        run: |
          cd android
          # This gives the runner permission to execute the build script
          chmod +x gradlew
          ./gradlew assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uno-buddy
          path: android/app/build/outputs/apk/debug/app-debug.apk
