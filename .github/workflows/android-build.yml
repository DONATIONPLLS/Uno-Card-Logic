name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        run: pnpm build
        
      - name: Sync Capacitor Android
        run: |
          # Use -w to explicitly allow adding to the workspace root
          pnpm add -D -w @capacitor/cli @capacitor/android
          
          # If gradlew is missing, recreate the android project
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            pnpm exec cap add android
          fi
          pnpm exec cap sync android

      - name: Force True Immersive Mode & App Polish
        run: |
          # 1. Find the MainActivity.java file
          FILE=$(find android -name MainActivity.java | head -n1)
          PKG_NAME=$(grep "^package " "$FILE")
          
          # 2. Overwrite MainActivity with the "Always Hide" Logic
          cat <<EOF > "$FILE"
          $PKG_NAME

          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemUI();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUI();
                  }
              }

              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                  );
              }
          }
          EOF

          # 3. Force the Android Theme to be Fullscreen
          STYLE_FILE=$(find android -name styles.xml | head -n1)
          if [ -f "$STYLE_FILE" ]; then
            cat <<EOF > "$STYLE_FILE"
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="AppTheme">
              </style>
          </resources>
          EOF
          fi

          # 4. Strip the Capacitor StatusBar plugin from the config just in case
          sed -i '/StatusBar:/,+4d' capacitor.config.ts
        working-directory: artifacts/uno-buddy
    

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uno-buddy
          path: android/app/build/outputs/apk/debug/app-debug.apk
