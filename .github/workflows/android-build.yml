name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        run: pnpm build
        
      - name: Sync & Repair Android Project
        run: |
          pnpm add -D -w @capacitor/cli @capacitor/android
          
          # 1. Backup your custom work (Brain)
          mkdir -p .backup
          cp android/app/src/main/java/com/unobuddy/app/MainActivity.java .backup/ || true
          cp android/app/src/main/res/values/styles.xml .backup/ || true
          
          # 2. Re-create the missing project files (Skeleton)
          rm -rf android
          pnpm exec cap add android
          
          # 3. Restore your custom code over the new default files
          cp .backup/MainActivity.java android/app/src/main/java/com/unobuddy/app/MainActivity.java || true
          cp .backup/styles.xml android/app/src/main/res/values/styles.xml || true
          
          # 4. Final sync to prepare the build
          pnpm exec cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uno-buddy
          path: android/app/build/outputs/apk/debug/app-debug.apk
